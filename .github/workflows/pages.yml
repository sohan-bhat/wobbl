name: pages
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "src/wobbl/viz/viewer/**"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      # the example pages' stills, drawn in the runner's Chrome by the pages' own playback stage with the studio and
      # the models, and kept by the hash of each view's runs, the studio, the models and the drawing code
      - uses: actions/cache@v4
        with:
          path: site/.cache/posters
          key: posters-${{ hashFiles('examples/**/scene.wobbl', 'site/public/data/play/**', 'site/public/env/**', 'site/public/models/**', 'site/src/scripts/play*.js', 'site/src/scripts/scene-*.js', 'site/src/scripts/run-*.js', 'site/src/scripts/part.js', 'site/src/scripts/orbit.js', 'site/src/lib/**', 'site/scripts/posters.mjs', 'site/scripts/scenes.mjs') }}
          restore-keys: posters-
      - name: Build the site and its search index
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
