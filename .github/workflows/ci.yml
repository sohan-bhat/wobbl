name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    env:
      PYVISTA_OFF_SCREEN: "true"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: System libraries for gmsh and off screen rendering (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libgl1 xvfb

      - uses: pyvista/setup-headless-display-action@v4

      - name: Install Wobbl
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -m "not solver" -q

      - name: Cache solver downloads
        uses: actions/cache@v4
        with:
          path: ~/.wobbl/mamba/pkgs
          key: solvers-${{ runner.os }}-${{ runner.arch }}-v1

      - name: wobbl setup (solvers only)
        run: wobbl setup --no-agents

      - name: wobbl doctor
        run: wobbl doctor

      - name: End to end tests with CalculiX and ngspice
        run: python -m pytest -m solver -q

      - name: Agent registration round trip in a scratch home
        shell: bash
        run: |
          export WOBBL_AGENT_HOME="$RUNNER_TEMP/agenthome"
          mkdir -p "$WOBBL_AGENT_HOME"
          wobbl setup --no-solvers --agents all
          wobbl doctor
          wobbl uninstall --yes

  npm:
    name: npm launcher / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22"]
        include:
          # the oldest Node that package.json promises to support
          - os: ubuntu-latest
            node: "18"
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Launcher tests with fake uv, pipx and wobbl
        run: npm test

      - name: Only bin/ and the docs go into the package
        shell: bash
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            console.log(files.join("\n"));
            const want = ["LICENSE", "README.md", "bin/wobbl.js", "package.json"];
            if (JSON.stringify(files) !== JSON.stringify(want)) process.exit(1);
          '
