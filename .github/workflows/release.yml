name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Check the tag matches the npm launcher version too, before anything is published
        run: |
          version=$(python -c "import json; print(json.load(open('npm/package.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match npm/package.json version $version"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wobbl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The npm launcher installs wobbl from PyPI, so it goes out after the PyPI upload.
  npm:
    needs: pypi
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/wobbl
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use npm 11.5 or newer, which trusted publishing needs
        run: npm install -g npm@11.19.1 && npm --version
      - name: Check the tag matches npm/package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match npm/package.json version $version"; exit 1; }
      - name: See whether this version still needs publishing
        id: state
        run: |
          version=$(node -p "require('./package.json').version")
          package=$(curl -s -o /dev/null -w '%{http_code}' https://registry.npmjs.org/wobbl)
          release=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/wobbl/$version")
          if [ "$package" = 404 ]; then
            echo "::notice title=npm publish skipped::wobbl is not on npm yet. The first npm publish is done by hand, see docs/publishing.md."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$release" = 200 ]; then
            echo "::notice title=npm publish skipped::wobbl $version is already on npm, so there is nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing (OIDC) can only be configured on npmjs.com once the package exists,
      # after the owner's first publish by hand. Until it is configured npm rejects this step.
      # continue-on-error keeps that from failing a release that has already reached PyPI,
      # and the next step says in the log what happened and what to do.
      - name: Publish with npm trusted publishing
        id: publish
        if: steps.state.outputs.publish == 'true'
        continue-on-error: true
        run: npm publish --provenance --access public
      - name: Explain a skipped npm publish
        if: steps.publish.outcome == 'failure'
        run: |
          echo "::warning title=npm publish skipped::npm did not accept the publish, most likely because trusted publishing is not configured for wobbl yet. Set it up as docs/publishing.md describes, then publish this version by hand with 'cd npm && npm publish --access public'."

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with this version's changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
