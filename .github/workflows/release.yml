name: release
on:
  push:
    tags: ["v*"]
  # Run by hand to check that npm trusted publishing works, without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # npm only says no at the very end, after PyPI already has the release. So ask npm first
  # whether it will take a trusted publish from this workflow, and stop before anything is
  # published when it will not. Trading the GitHub OIDC token for a short lived npm token is
  # the same exchange `npm publish` makes, and the token is thrown away.
  npm-check:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/wobbl
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check that npm accepts trusted publishing from this workflow
        run: |
          id_token=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          code=$(curl -sS -o exchange.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/wobbl)
          # npm answers 201 Created with a short lived token when it will take the publish
          if [ "$code" = 200 ] || [ "$code" = 201 ]; then
            echo "npm accepts trusted publishing for wobbl from release.yml in the npm environment."
            rm -f exchange.json
            exit 0
          fi
          echo "npm answered HTTP $code"
          jq -r '.message // .error // .' exchange.json 2>/dev/null || cat exchange.json
          rm -f exchange.json
          echo "::error title=npm trusted publishing is not set up::npm will not take a publish of wobbl from this workflow, so nothing was published. On npmjs.com open the wobbl package, Settings, Trusted Publisher, pick GitHub Actions and enter user sohan-bhat, repository wobbl, workflow release.yml and environment npm. Then run this workflow again. docs/publishing.md has the details."
          exit 1

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Check the tag matches the npm launcher version too, before anything is published
        run: |
          version=$(python -c "import json; print(json.load(open('npm/package.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match npm/package.json version $version"; exit 1; }
      - name: Check the tag matches the version wobbl --version reports
        run: |
          version=$(python -c "import re; print(re.search(r'^__version__ = \"([^\"]+)\"', open('src/wobbl/__init__.py').read(), re.M)[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match __version__ $version in src/wobbl/__init__.py"; exit 1; }
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: [npm-check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wobbl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The npm launcher installs wobbl from PyPI, so it goes out after the PyPI upload.
  npm:
    needs: pypi
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/wobbl
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use npm 11.5 or newer, which trusted publishing needs
        run: npm install -g npm@11.19.1 && npm --version
      - name: Check the tag matches npm/package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match npm/package.json version $version"; exit 1; }
      - name: See whether this version still needs publishing
        id: state
        run: |
          version=$(node -p "require('./package.json').version")
          release=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/wobbl/$version")
          if [ "$release" = 200 ]; then
            echo "::notice title=npm publish skipped::wobbl $version is already on npm, so there is nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # A failed publish fails the run. It used to be allowed to fail quietly, which is how
      # 0.1.1 reached PyPI and never reached npm while the run still showed green.
      - name: Publish with npm trusted publishing
        if: steps.state.outputs.publish == 'true'
        run: npm publish --provenance --access public
      - name: Check the new version is on npm
        if: steps.state.outputs.publish == 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          # npm says a new version may take a few minutes to show, so this waits up to 10 minutes
          for i in $(seq 1 60); do
            test "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/wobbl/$version")" = 200 && exit 0
            sleep 10
          done
          echo "::error title=wobbl $version is not on npm::npm publish finished but the registry does not list wobbl $version."
          exit 1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with this version's changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
