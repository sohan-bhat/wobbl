[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wobbl"
version = "0.1.2"
description = "Simulate anything before you build it. Verified engineering simulation for AI coding agents and humans."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sohan Bhat" }]
keywords = ["fea", "simulation", "calculix", "gmsh", "mcp", "engineering", "cad", "ngspice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "gmsh>=4.11",
    "matplotlib>=3.7",
    "rich>=13",
    "click>=8.1",
    "mcp>=1.2",
    "tomli>=2; python_version < '3.11'",
    # cryptography (pulled in by mcp) stopped shipping Intel Mac wheels at 49, so
    # without this cap those Macs would need Rust and a C compiler to install Wobbl
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# pyvista lets a test open result.vtu with VTK itself, and the website scripts read results with it; Wobbl
# draws and writes everything without it
dev = ["pytest>=7", "pytest-timeout>=2", "cantera>=3.1", "mujoco>=3.3,<3.11", "pyvista>=0.43"]
# Cantera otherwise installs itself into ~/.wobbl the first time a combustion or motor study runs
chem = ["cantera>=3.1"]
# MuJoCo likewise arrives with the first mechanism study; 3.10 is the last release with Intel Mac wheels
mechanism = ["mujoco>=3.3,<3.11"]

[project.scripts]
wobbl = "wobbl.cli.main:main"

[project.urls]
Homepage = "https://sohan-bhat.github.io/wobbl/"
Documentation = "https://sohan-bhat.github.io/wobbl/get-started/"
Source = "https://github.com/sohan-bhat/wobbl"
Issues = "https://github.com/sohan-bhat/wobbl/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/wobbl"]

[tool.hatch.build.targets.sdist]
exclude = ["examples/**/*.png", "examples/**/report.html", "docs/img", "site", "scripts", "npm", ".github", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "solver: needs CalculiX or ngspice installed by wobbl setup",
    "slow: long running end to end case",
]
