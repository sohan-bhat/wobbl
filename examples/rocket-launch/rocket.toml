# A level 2 high power rocket on a 75 mm L class motor, flown with dual deploy recovery.
#
# Every quantity takes a unit ("4.6 kg", "98 mm", "10 mph"). Positions along the rocket are measured
# from the tip of the nose. Run it with: wobbl motion rocket.toml

name = "rocket"

[rocket]
mass = "4.6 kg"            # everything but the motor
diameter = "98 mm"         # body tube outside diameter, the reference for drag and stability
length = "2.1 m"           # nose tip to aft end
cg = "1.36 m"              # balance point from the nose tip, measured with the motor loaded
cd = 0.45                  # subsonic drag coefficient, which Wobbl raises through Mach 1
# cd = [[0.0, 0.45], [0.9, 0.52], [1.1, 0.78], [2.0, 0.55]]   # or a table against Mach

[nose]
shape = "ogive"            # cone, ogive, elliptical, parabolic or haack (von Karman)
length = "45 cm"

[fins]
count = 3
root = "20 cm"
tip = "7 cm"
span = "9 cm"
sweep = "11 cm"            # how far the tip's leading edge sits behind the root's
# position = "1.90 m"      # root leading edge from the nose tip, flush with the aft end when left out

[motor]
name = "75 mm L class"
loaded_mass = "3.35 kg"    # case, closures and propellant
propellant = "1.88 kg"
length = "53 cm"           # for the balance point at burnout, the motor sits flush with the aft end
thrust = [                 # seconds, newtons, straight lines between points
  [0.00, 0], [0.03, 1700], [0.10, 1580], [0.30, 1560], [0.60, 1580], [1.00, 1600], [1.40, 1590],
  [1.80, 1540], [2.10, 1450], [2.30, 1250], [2.45, 800], [2.55, 350], [2.65, 0],
]
# thrust_units = ["s", "lbf"]   # when the table is in other units
# eng = "motor.eng"             # or a RASP .eng file from thrustcurve.org in place of the table

[launch]
rail_length = "2.44 m"     # an 8 ft rail
rail_angle = "5 deg"       # tilted from vertical, leaning into the wind
wind = "10 mph"            # blowing toward the pad from the side the rail leans to
site_altitude = "0 m"      # ground above sea level

[drogue]
diameter = "46 cm"         # an 18 inch drogue, opened at apogee
cd = 1.5

[main]
diameter = "1.52 m"        # a 60 inch main
cd = 1.5
deploy = "150 m"           # above the ground, on the way down

[targets]
apogee = "11000 ft"
landing_speed = "6.1 m/s"  # about 20 ft/s
